<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S'inscrire Anonymement — AnonyTalk</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="auth-page">

    <div class="auth-card animate-fade">
        <div class="auth-logo">
            <div class="logo-mark">A</div>
            <h1>Rejoignez AnonyTalk</h1>
            <p>Créez un compte sans aucune donnée personnelle.</p>
        </div>

        <form id="register-form">
            <div class="form-group">
                <label for="initials" class="form-label">Initiales</label>
                <input type="text" id="initials" class="form-input" placeholder="ex: A.Y." maxlength="3" required>
                <p class="form-hint">2 ou 3 lettres max.</p>
            </div>
            
            <div class="form-group">
                <label for="username" class="form-label">Pseudonyme</label>
                <input type="text" id="username" class="form-input" placeholder="ex: VoyageurSerein" required minlength="4">
                <p class="form-hint">Utilisez un nom qui ne vous identifie pas.</p>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 10px;">
                Créer mon compte
            </button>
        </form>

        <div class="divider-text">
            <span>Déjà membre ?</span>
        </div>

        <div class="auth-footer">
            <a href="login.html" class="btn btn-secondary btn-full">Se connecter</a>
            <p style="margin-top: 24px;">
                En vous inscrivant, vous acceptez de rester bienveillant et respectueux envers les autres membres.
            </p>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
