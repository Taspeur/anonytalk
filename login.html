<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — AnonyTalk</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="auth-page">

    <div class="auth-card animate-fade">
        <div class="auth-logo">
            <div class="logo-mark">A</div>
            <h1>Connexion</h1>
            <p>Accédez à votre espace sécurisé.</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="username" class="form-label">Pseudonyme</label>
                <input type="text" id="username" class="form-input" placeholder="Votre pseudo" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 10px;">
                Se connecter
            </button>
        </form>

        <div class="divider-text">
            <span>Nouveau ici ?</span>
        </div>

        <div class="auth-footer">
            <a href="register.html" class="btn btn-secondary btn-full">Créer un compte anonyme</a>
            <p style="margin-top: 24px;">
                Si vous avez oublié votre mot de passe, contactez un administrateur via le formulaire de contact (prochainement).
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
