<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discussion — AnonyTalk</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/chat.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="nav-logo">
                <div class="logo-icon">A</div>
                <span>AnonyTalk</span>
            </a>
            <ul class="nav-links">
                <!-- Populated by app.js -->
            </ul>
            <div class="nav-actions">
                <!-- Populated by app.js -->
            </div>
        </div>
    </nav>

    <div class="main-content" style="max-width: 900px; margin: 80px auto 0; padding-bottom: 40px;">
        <div style="margin-bottom: 24px;">
            <a href="dashboard.html" class="btn btn-secondary btn-sm">← Retour au flux</a>
        </div>

        <!-- Post Details -->
        <article id="post-detail" class="card" style="margin-bottom: 32px; border-color: var(--accent-glow);">
            <div class="post-header">
                <div id="post-author-avatar" class="avatar">??</div>
                <div>
                    <div id="post-author-name" style="font-weight: 700;">Chargement...</div>
                    <div id="post-date" style="font-size: 0.8rem; color: var(--text-muted);">---</div>
                </div>
                <div style="margin-left: auto; display: flex; gap: 10px; align-items: center;">
                    <span id="post-type-tag" class="badge badge-red" style="display: none;">🔒 Privé</span>
                    <span id="post-category-tag" class="badge badge-purple">---</span>
                </div>
            </div>
            <h1 id="post-title" style="font-size: 1.8rem; margin-bottom: 20px;">---</h1>
            <div id="post-content" style="font-size: 1.05rem; line-height: 1.7; color: var(--text-primary); white-space: pre-wrap;">
                ---
            </div>
        </article>

        <!-- Messages / Replies -->
        <h3 style="margin-bottom: 20px;">Réponses (<span id="reply-count">0</span>)</h3>
        <div id="chat-messages" class="chat-messages" style="margin-bottom: 32px; padding: 0; min-height: auto;">
            <!-- Messages will be loaded here -->
        </div>

        <!-- Reply Form -->
        <div class="card" style="padding: 0; overflow: hidden; border-color: var(--border);">
            <form id="reply-form" class="chat-input-area" style="background: var(--bg-card);">
                <textarea id="reply-input" class="chat-input" placeholder="Écrivez votre réponse en toute bienveillance..." rows="3"></textarea>
                <button type="submit" class="btn btn-primary" style="height: 50px;">
                    Envoyer
                </button>
            </form>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/app.js"></script>
    <script src="js/chat.js"></script>
    <script>
        let postId;
        let messagesContainer;
        let replyInput;
        let replyForm;

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            postId = params.get('id');
            if (!postId) { window.location.href = 'dashboard.html'; return; }

            messagesContainer = document.getElementById('chat-messages');
            replyInput = document.getElementById('reply-input');
            replyForm = document.getElementById('reply-form');

            // Initialize
            Auth.requireAuth().then(() => {
                loadPostDetail();
            });

            // --- Handle Reply Submission ---
            replyForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const user = await Auth.getCurrentUser();
                const content = replyInput.value.trim();
                
                if (!content) return;

                const btn = replyForm.querySelector('button');
                UI.setLoading(btn, true);

                const { error } = await supabase
                    .from('messages')
                    .insert({
                        post_id: postId,
                        author_id: user.id,
                        content: content
                    });

                if (error) {
                    UI.showToast(error.message, "error");
                    UI.setLoading(btn, false);
                    return;
                }

                replyInput.value = '';
                UI.setLoading(btn, false);
                // No need to call loadMessages here manually if we have real-time
                UI.showToast("Réponse envoyée", "success");
            });

            // --- Real-time Subscription ---
            supabase
                .channel(`post-${postId}`)
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'messages',
                    filter: `post_id=eq.${postId}`
                }, (payload) => {
                    console.log('New message received!', payload);
                    loadMessages();
                })
                .subscribe();
        });

        // --- Load Post Details ---
        async function loadPostDetail() {
            const { data: post, error } = await supabase
                .from('posts')
                .select(`
                    *,
                    profiles (
                        username,
                        initials,
                        role
                    )
                `)
                .eq('id', postId)
                .single();

            if (error || !post) { window.location.href = 'dashboard.html'; return; }

            const author = post.profiles || { initials: '??', username: 'Anonyme' };
            const currentUser = await Auth.getCurrentUser();

            // Security check for counselor posts
            if (post.type === 'counselor') {
                const canAccess = currentUser && (currentUser.id === post.author_id || currentUser.role === 'counselor' || currentUser.role === 'admin');
                if (!canAccess) {
                    UI.showToast("Vous n'avez pas accès à cette discussion privée.", "error");
                    setTimeout(() => window.location.href = 'dashboard.html', 1500);
                    return;
                }
                document.getElementById('post-type-tag').style.display = 'inline-block';
                document.getElementById('post-detail').style.borderColor = 'var(--accent-2)';
            }

            // Update UI
            document.getElementById('post-author-avatar').innerText = author.initials;
            document.getElementById('post-author-name').innerText = author.username;
            document.getElementById('post-date').innerText = new Date(post.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('post-category-tag').innerText = post.category;
            document.getElementById('post-title').innerText = post.title;
            document.getElementById('post-content').innerText = post.content;
            
            await loadMessages();
        }

        // --- Load Messages (Replies) ---
        async function loadMessages() {
            const { data: messages, error } = await supabase
                .from('messages')
                .select(`
                    *,
                    profiles (
                        username,
                        initials,
                        role
                    )
                `)
                .eq('post_id', postId)
                .order('created_at', { ascending: true });

            if (error) return;

            const currentUser = await Auth.getCurrentUser();
            
            document.getElementById('reply-count').innerText = messages ? messages.length : 0;

            if (!messages || messages.length === 0) {
                messagesContainer.innerHTML = `<div class="empty-state" style="padding: 20px; opacity: 0.6;"><p>Aucune réponse pour le moment.</p></div>`;
                return;
            }

            messagesContainer.innerHTML = messages.map(msg => {
                const author = msg.profiles || { initials: '??', username: 'Anonyme', role: 'user' };
                const isOwn = currentUser && currentUser.id === msg.author_id;
                const date = new Date(msg.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                
                return `
                    <div class="message ${isOwn ? 'own' : ''}">
                        <div class="avatar avatar-sm" style="${author.role !== 'user' ? 'background: var(--accent-2); border: 2px solid white;' : ''}">
                            ${author.initials}
                        </div>
                        <div class="message-bubble">
                            <div style="font-size: 0.75rem; font-weight: 700; margin-bottom: 4px; opacity: 0.8; display: flex; align-items: center; gap: 5px;">
                                ${author.username} 
                                ${author.role === 'admin' ? '<span class="badge badge-red" style="font-size: 0.6rem; padding: 1px 4px;">Admin</span>' : ''}
                                ${author.role === 'counselor' ? '<span class="badge badge-blue" style="font-size: 0.6rem; padding: 1px 4px;">Conseiller</span>' : ''}
                            </div>
                            <div class="message-text">${msg.content}</div>
                            <span class="message-time">${date}</span>
                        </div>
                    </div>
                `;
            }).join('');

            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    </script>
</body>
</html>
