<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discussion — AnonyTalk</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/chat.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="nav-logo">
                <div class="logo-icon">A</div>
                <span>AnonyTalk</span>
            </a>
            <ul class="nav-links">
                <!-- Populated by app.js -->
            </ul>
            <div class="nav-actions">
                <!-- Populated by app.js -->
            </div>
        </div>
    </nav>

    <div class="main-content" style="max-width: 900px; margin: 80px auto 0; padding-bottom: 40px;">
        <div style="margin-bottom: 24px;">
            <a href="dashboard.html" class="btn btn-secondary btn-sm">← Retour au flux</a>
        </div>

        <!-- Post Details -->
        <article id="post-detail" class="card" style="margin-bottom: 32px; border-color: var(--accent-glow);">
            <div class="post-header">
                <div id="post-author-avatar" class="avatar">??</div>
                <div>
                    <div id="post-author-name" style="font-weight: 700;">Chargement...</div>
                    <div id="post-date" style="font-size: 0.8rem; color: var(--text-muted);">---</div>
                </div>
                <div style="margin-left: auto;">
                    <span id="post-category-tag" class="badge badge-purple">---</span>
                </div>
            </div>
            <h1 id="post-title" style="font-size: 1.8rem; margin-bottom: 20px;">---</h1>
            <div id="post-content" style="font-size: 1.05rem; line-height: 1.7; color: var(--text-primary); white-space: pre-wrap;">
                ---
            </div>
        </article>

        <!-- Messages / Replies -->
        <h3 style="margin-bottom: 20px;">Réponses (<span id="reply-count">0</span>)</h3>
        <div id="chat-messages" class="chat-messages" style="margin-bottom: 32px; padding: 0; min-height: auto;">
            <!-- Messages will be loaded here -->
        </div>

        <!-- Reply Form -->
        <div class="card" style="padding: 0; overflow: hidden; border-color: var(--border);">
            <form id="reply-form" class="chat-input-area" style="background: var(--bg-card);">
                <textarea id="reply-input" class="chat-input" placeholder="Écrivez votre réponse en toute bienveillance..." rows="3"></textarea>
                <button type="submit" class="btn btn-primary" style="height: 50px;">
                    Envoyer
                </button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/chat.js"></script>
    <script>
        Auth.requireAuth();

        // Handle post details display
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');
            if (!postId) { window.location.href = 'dashboard.html'; return; }

            const posts = JSON.parse(localStorage.getItem(STORAGE_KEYS.POSTS) || "[]");
            const post = posts.find(p => p.id === postId);
            if (!post) { window.location.href = 'dashboard.html'; return; }

            const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || "[]");
            const author = users.find(u => u.id === post.authorId) || { initials: '??', username: 'Anonyme' };

            // Update UI
            document.getElementById('post-author-avatar').innerText = author.initials;
            document.getElementById('post-author-name').innerText = author.username;
            document.getElementById('post-date').innerText = new Date(post.createdAt).toLocaleString('fr-FR');
            document.getElementById('post-title').innerText = post.title;
            document.getElementById('post-content').innerText = post.content;
            document.getElementById('post-category-tag').innerText = post.category;
            
            // Initial message load
            loadMessages(postId);

            // Handle reply
            const replyForm = document.getElementById('reply-form');
            replyForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const content = document.getElementById('reply-input').value.trim();
                if (!content) return;

                const user = Auth.getCurrentUser();
                const messages = JSON.parse(localStorage.getItem(STORAGE_KEYS.MESSAGES) || "[]");
                
                const newMessage = {
                    id: 'msg-' + Date.now(),
                    postId: postId,
                    authorId: user.id,
                    content: content,
                    createdAt: new Date().toISOString()
                };

                messages.push(newMessage);
                localStorage.setItem(STORAGE_KEYS.MESSAGES, JSON.stringify(messages));
                
                document.getElementById('reply-input').value = '';
                loadMessages(postId);
                UI.showToast("Réponse envoyée", "success");
            });
        });

        function loadMessages(postId) {
            const messages = JSON.parse(localStorage.getItem(STORAGE_KEYS.MESSAGES) || "[]");
            const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || "[]");
            const currentUser = Auth.getCurrentUser();
            const container = document.getElementById('chat-messages');
            
            const postMessages = messages.filter(m => m.postId === postId);
            document.getElementById('reply-count').innerText = postMessages.length;

            if (postMessages.length === 0) {
                container.innerHTML = `<div class="empty-state" style="padding: 20px;">Soyez le premier à répondre !</div>`;
                return;
            }

            container.innerHTML = postMessages.map(msg => {
                const author = users.find(u => u.id === msg.authorId) || { initials: '??', username: 'Anonyme', role: 'user' };
                const isOwn = currentUser && currentUser.id === msg.authorId;
                const date = new Date(msg.createdAt).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                
                return `
                    <div class="message ${isOwn ? 'own' : ''}">
                        <div class="avatar avatar-sm" style="${author.role !== 'user' ? 'background: var(--accent-2); border: 2px solid white;' : ''}">
                            ${author.initials}
                        </div>
                        <div class="message-bubble">
                            <div style="font-size: 0.75rem; font-weight: 700; margin-bottom: 4px; opacity: 0.8;">
                                ${author.username} ${author.role !== 'user' ? '(Conseiller)' : ''}
                            </div>
                            ${msg.content}
                            <span class="message-time">${date}</span>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
